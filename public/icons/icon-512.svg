<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#0E1411"/>
  <!-- Stopwatch ticks ring -->
  <g transform="translate(256, 256)">
    <circle cx="0" cy="0" r="200" fill="none" stroke="#2A3830" stroke-width="2"/>
    <!-- Major ticks -->
    <line x1="0" y1="-200" x2="0" y2="-164" stroke="#FF5A2B" stroke-width="10" stroke-linecap="round"/>
    <line x1="200" y1="0" x2="164" y2="0" stroke="#CFEA6B" stroke-width="8" stroke-linecap="round"/>
    <line x1="0" y1="200" x2="0" y2="164" stroke="#CFEA6B" stroke-width="8" stroke-linecap="round"/>
    <line x1="-200" y1="0" x2="-164" y2="0" stroke="#CFEA6B" stroke-width="8" stroke-linecap="round"/>
    <!-- Orange active dot at 12 o clock -->
    <circle cx="0" cy="-156" r="12" fill="#FF5A2B"/>
    <!-- 60 Text in center -->
    <text x="0" y="26" text-anchor="middle" font-family="monospace, sans-serif" font-weight="900" font-size="116" fill="#F4F6F0" letter-spacing="-4">60</text>
  </g>
</svg>
